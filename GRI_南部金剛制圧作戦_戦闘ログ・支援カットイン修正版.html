<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南部金剛制圧作戦</title>
<style>
:root{--bg:#07111d;--panel:#102238;--line:#36516b;--text:#edf6ff;--muted:#91a9bf;--blue:#66d0ed;--gold:#e9c779}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,rgba(63,132,168,.28),transparent 48%),linear-gradient(135deg,#07111d,#0b1929 52%,#081321);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:760px;margin:auto;padding:14px}
header{padding:10px 4px 14px;border-bottom:1px solid #355773;position:relative}
header:after{content:"";position:absolute;bottom:-1px;left:0;width:90px;height:2px;background:var(--blue)}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--blue);font-weight:800}
h1{font-size:clamp(24px,5vw,34px);margin:5px 0;font-weight:900;letter-spacing:.06em}
.sub{font-size:13px;color:var(--muted)}
.panel{background:linear-gradient(145deg,rgba(20,39,59,.97),rgba(9,23,38,.97));border:1px solid rgba(91,132,164,.48);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #0004}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wallet strong{font-size:22px;color:var(--gold)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{min-height:135px;text-align:left;padding:18px;background:linear-gradient(145deg,#1b3852,#10253a);border:1px solid #476987;border-radius:13px;color:var(--text);cursor:pointer}
.mode b{display:block;font-size:19px;margin-bottom:8px}
.mode span{font-size:12px;color:#a9bfd1;line-height:1.6}
button{font:inherit;color:var(--text);background:#203854;border:1px solid #3d5d7d;border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{filter:brightness(1.15)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toolbar button.active{border-color:#70cce6;background:#294b68}
.frame-wrap{display:none;margin-top:12px}
.frame-wrap.active{display:block}
iframe{width:100%;height: min(90vh,1000px);min-height:760px;border:1px solid #36516b;border-radius:14px;background:#07111d}
.common{display:none}
.common.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #36516b}
.empty{color:var(--muted);font-size:13px}
@media(max-width:560px){.shell{padding:9px}.modes{grid-template-columns:1fr}.mode{min-height:100px;padding:14px}iframe{height:88svh;min-height:700px}.panel{padding:12px}}
</style>
</head>
<body>
<div class="shell">
<header>
 <h1>南部金剛制圧作戦</h1>

</header>
<section class="panel wallet">
 <div><div class="sub">購入ポイント</div><strong id="wallet">0 P</strong></div>

</section>
<section class="panel" id="home">
 <h2>作戦モード選択</h2>
 <div class="modes">
  <button class="mode" onclick="openMode('research')"><b>01　ミシャエム解析</b></button>
  <button class="mode" onclick="openMode('boss')"><b>02　ミシャエム討伐</b></button>
 </div>
 <div class="toolbar"><button onclick="showCommon('ranking')">ランキング</button></div>
</section>
<section class="panel common" id="rankingView">
 <h2>ランキング</h2><div id="rankingTable"></div>
 <div class="toolbar"><button onclick="goHome()">モード選択へ戻る</button></div>
</section>
<div class="toolbar" id="modeToolbar" style="display:none">
 <button onclick="goHome()">モード選択</button>
 <button id="researchTab" onclick="openMode('research')">ミシャエム解析</button>
 <button id="bossTab" onclick="openMode('boss')">ミシャエム討伐</button>
</div>
<div class="frame-wrap" id="researchFrame"><iframe id="researchGame" title="ミシャエム解析"></iframe></div>
<div class="frame-wrap" id="bossFrame"><iframe id="bossGame" title="ミシャエム討伐"></iframe></div>
</div>

 if(!allowed.some(base=>data.url.startsWith(base)))return;
 window.location.assign(data.url);
});
function mount(key){if(loaded[key])return;const frame=document.getElementById(key==='research'?'researchGame':'bossGame');frame.srcdoc=decode64(key==='research'?RESEARCH_B64:BOSS_B64);loaded[key]=true}
function wallet(){document.getElementById('wallet').textContent=(Number(localStorage.getItem('griUnifiedPoints')||0)).toLocaleString()+' P'}
function openMode(key){document.getElementById('home').style.display='none';document.querySelectorAll('.common').forEach(x=>x.classList.remove('active'));document.getElementById('modeToolbar').style.display='flex';document.getElementById('researchFrame').classList.toggle('active',key==='research');document.getElementById('bossFrame').classList.toggle('active',key==='boss');mount(key);document.getElementById('researchTab').classList.toggle('active',key==='research');document.getElementById('bossTab').classList.toggle('active',key==='boss');wallet()}
function goHome(){document.getElementById('home').style.display='block';document.getElementById('modeToolbar').style.display='none';document.getElementById('researchFrame').classList.remove('active');document.getElementById('bossFrame').classList.remove('active');document.querySelectorAll('.common').forEach(x=>x.classList.remove('active'));wallet()}
function showCommon(which){document.getElementById('home').style.display='none';document.querySelectorAll('.common').forEach(x=>x.classList.remove('active'));document.getElementById(which+'View').classList.add('active');document.getElementById('modeToolbar').style.display='none';if(which==='ranking')renderUnifiedRanking();wallet()}
function renderUnifiedRanking(){let rows=[];try{rows=JSON.parse(localStorage.getItem('griUnifiedRanking')||'[]')}catch(e){}const el=document.getElementById('rankingTable');if(!rows.length){el.innerHTML='<div class="empty">ランキングデータはありません。</div>';return}el.innerHTML='<table><thead><tr><th>順位</th><th>モード</th><th>隊員名</th><th>獲得ポイント</th><th>記録</th><th>日付</th></tr></thead><tbody>'+rows.slice(0,30).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.mode)+'</td><td>'+esc(r.name)+'</td><td>'+Number(r.score||0).toLocaleString()+'</td><td>'+esc(r.detail||'')+'</td><td>'+esc(r.date||'')+'</td></tr>').join('')+'</tbody></table>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.addEventListener('storage',e=>{if(e.key==='griUnifiedPoints')wallet();if(e.key==='griUnifiedRanking')renderUnifiedRanking()});
window.addEventListener('message',e=>{if(e.data?.type==='gri-ranking-updated')renderUnifiedRanking()});
wallet();
</script>

<script>
window.addEventListener('message',function(event){
  if(!event.data||event.data.type!=='gri-boss-height'||!Number.isFinite(event.data.height))return;
  var frame=document.getElementById('bossGame');
  if(frame&&window.matchMedia('(max-width:620px)').matches){
    frame.style.height=Math.max(850,Math.min(event.data.height+30,6000))+'px';
    frame.style.minHeight='0';
  }
});
</script>
